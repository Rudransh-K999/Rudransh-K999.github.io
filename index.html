<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>503 — Under Development</title>
  <style>
    /* ===== FONT FACE ===== */
    @font-face {
      font-family: "Geist Mono:SemiBold";
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      src: url("https://static.figma.com/font/GeistMono_wght__1") format("woff2");
    }

    /* ===== GLOBAL RESET ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      background: #000;
      overflow-x: hidden;
      font-family: "Geist Mono:SemiBold", monospace;
    }

    /* ===== PAGE ===== */
    .page {
      position: relative;
      min-height: 100svh;
      width: 100%;
      background: #000;
      overflow-x: hidden;
    }

    /* ===== BACKGROUND VIDEO (lowest layer) ===== */
    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 1;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== CENTERED 503 CONTENT ===== */
    .content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 483px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 44px;
      z-index: 10;
    }

    /* ===== 503 HEADING ===== */
    .heading {
      font-family: "Geist Mono:SemiBold", monospace;
      font-weight: 600;
      font-size: 295.751px;
      line-height: 1.1;
      letter-spacing: -24.6459px;
      text-align: center;
      background: linear-gradient(
        247.3282658084845deg,
        rgb(255, 255, 255) 2.5334%,
        rgba(255, 255, 255, 0.4) 93.612%
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      padding-bottom: 0.1em;
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    /* ===== DIVIDER ===== */
    .divider {
      width: 425px;
      height: 1px;
      background-color: #ffffff;
      flex-shrink: 0;
    }

    /* ===== MESSAGE ===== */
    .message {
      font-family: "Geist Mono:SemiBold", monospace;
      font-weight: 600;
      font-size: 24px;
      line-height: 1.1;
      letter-spacing: -2px;
      color: #ffffff;
      text-align: center;
      width: 100%;
      margin: 0;
    }

    /* ===== RESPONSIVE — MOBILE (≤640px) ===== */
    @media (max-width: 640px) {
      .content {
        width: min(100% - 40px, 360px);
        gap: 28px;
      }

      .heading {
        font-size: clamp(140px, 52vw, 200px);
        letter-spacing: -0.09em;
        height: auto;
        min-height: 0;
        padding-bottom: 0.1em;
      }

      .divider {
        width: 100%;
      }

      .message {
        font-size: clamp(16px, 4.5vw, 20px);
        letter-spacing: -1.3px;
      }
    }
  </style>
</head>
<body>

  <main class="page" aria-label="503 Under Development">

    <!-- ===== BACKGROUND VIDEO (lowest layer) ===== -->
    <video
      class="bg-video"
      autoplay
      loop
      muted
      playsinline
      aria-hidden="true"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260801_001207_ec20d138-aa45-4b2b-ab8c-bdc71607f240.mp4"
    ></video>

    <!-- ===== CENTERED 503 CONTENT (above video) ===== -->
    <div class="content">
      <h1 class="heading">503</h1>
      <div class="divider"></div>
      <p class="message">Under Development — Coming Soon!!</p>
    </div>

  </main>

  <!-- ===== SCRIPT ===== -->
  <script>
    (function () {
      "use strict";

      /* Background video playback reliability */
      var video = document.querySelector(".bg-video");
      if (!video) return;

      // Ensure muted is set (autoplay policies)
      video.muted = true;

      function tryPlay() {
        if (video.paused) {
          var p = video.play();
          if (p && typeof p.catch === "function") {
            p.catch(function () {
              /* swallow autoplay rejection */
            });
          }
        }
      }

      // Try immediately
      tryPlay();

      // Try on canplay
      video.addEventListener("canplay", tryPlay);

      // Try when page becomes visible
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden) tryPlay();
      });

      // Try once on first user interaction (fallback)
      var interactionEvents = ["pointerdown", "touchstart", "scroll"];
      var interactionFired = false;
      function onFirstInteraction() {
        if (interactionFired) return;
        interactionFired = true;
        tryPlay();
        interactionEvents.forEach(function (evt) {
          window.removeEventListener(evt, onFirstInteraction, { passive: true });
        });
      }
      interactionEvents.forEach(function (evt) {
        window.addEventListener(evt, onFirstInteraction, { passive: true });
      });
    })();
  </script>

</body>
</html>
